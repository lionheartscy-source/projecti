name: Build report index

# reports/ 에 파일이 추가·수정·삭제되면 reports.json 을 다시 만들어 커밋한다.
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'scripts/build-reports.py'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # git log 로 커밋일을 읽으므로 전체 히스토리 필요

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: reports.json 생성
        run: python scripts/build-reports.py

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain reports.json)" ]; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json
          git commit -m "chore: reports.json 자동 갱신 [skip ci]"
          git push
