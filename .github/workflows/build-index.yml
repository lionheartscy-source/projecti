name: Build report index

# reports/ 에 파일이 추가·수정·삭제되면 reports.json / reports.js 를 다시 만들어 커밋한다.
# 로컬의 업로드.bat 과 같은 스크립트(tools/build-reports.ps1)를 쓴다.
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'tools/build-reports.ps1'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # git log 로 커밋일을 읽으므로 전체 히스토리 필요

      - name: 리포트 목록 생성
        shell: pwsh           # ubuntu 러너에 PowerShell 이 기본 탑재돼 있다
        run: ./tools/build-reports.ps1

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain reports.json reports.js)" ]; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.json reports.js
          git commit -m "chore: 리포트 목록 자동 갱신 [skip ci]"
          git push
